[package]
name = "task-ping"
version = "0.1.0"
edition = "2021"

[dependencies]
userlib = { path = "../../sys/userlib", features = ["panic-messages"] }

[build-dependencies]
build-util = { path = "../../build/util" }
idol.workspace = true

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { workspace = true }

[features]
uart = []
no-ipc-counters = ["idol/no-counters"]

[[bin]]
name = "task-ping"
test = false
doctest = false
bench = false

[lints]
workspace = true
