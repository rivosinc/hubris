inherit = "base.toml"


[tasks.uart_driver]
name = "drv-qemu_mainstream-ibex-uart-server"
features = ["no-ipc-counters"]
priority = 2
start = true
uses = ["uart0"]
stacksize = 2048

[tasks.uart_driver.config]
clk_freq_hz = 250_000_000
baud_rate = 115_200


[tasks.pong]
name = "task-pong"
features = ["no-leds", "no-ipc-counters"]
priority = 3
max-sizes = {flash = 8192, ram = 1024}
start = true
notifications = ["timer"]


[tasks.ping]
name = "task-ping"
features = ["uart"]
priority = 4
max-sizes = {flash = 8192, ram = 1024}
stacksize = 512
start = true
task-slots = [{peer = "pong"}, {usart_driver = "uart_driver"}]

