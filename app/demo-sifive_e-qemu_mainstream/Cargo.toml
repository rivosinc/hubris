[package]
edition = "2021"
readme = "README.md"
name = "demo-sifive_e-qemu_mainstream"
version = "0.1.0"

[dependencies]
cfg-if = { workspace = true }
riscv = { workspace = true }
riscv-rt-wrapper = { path = "../../lib/riscv-rt-wrapper", features = [ "vectored-interrupts" ] }
chip-sifive_e-qemu_mainstream = { path = "../../chips/sifive_e-qemu_mainstream" }

[dependencies.kern]
path = "../../sys/kern"
default-features = false

[build-dependencies]
build-util = {path = "../../build/util"}

# this lets you use `cargo fix`!
[[bin]]
name = "demo-sifive_e-qemu_mainstream"
test = false
bench = false
